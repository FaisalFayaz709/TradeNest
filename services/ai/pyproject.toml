[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tradenest-ai"
version = "0.0.0"
description = "TradeNest internal AI service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "scikit-learn>=1.6,<2",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
