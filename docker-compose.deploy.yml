name: tradenest

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - tradenest_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: "no"
    init: true
    environment: &api_environment
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      AI_SERVICE_URL: http://ai:8000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-tradenest-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tradenest-web}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CATALOG_DEFAULT_CURRENCY: ${CATALOG_DEFAULT_CURRENCY:-USD}
      SELLER_ANALYTICS_LOW_STOCK_THRESHOLD: ${SELLER_ANALYTICS_LOW_STOCK_THRESHOLD:-5}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      PAYMENT_SANDBOX_WEBHOOK_SECRET: ${PAYMENT_SANDBOX_WEBHOOK_SECRET:?PAYMENT_SANDBOX_WEBHOOK_SECRET is required}
      # Optional test-mode Stripe: passed to both migration and API containers.
      # Live keys are deliberately rejected by the deployment validator.
      PAYMENT_STRIPE_SECRET_KEY: ${PAYMENT_STRIPE_SECRET_KEY:-}
      PAYMENT_STRIPE_WEBHOOK_SECRET: ${PAYMENT_STRIPE_WEBHOOK_SECRET:-}
      PAYMENT_STRIPE_RETURN_ORIGIN: ${PAYMENT_STRIPE_RETURN_ORIGIN:-}
      OBSERVABILITY_METRICS_TOKEN: ${OBSERVABILITY_METRICS_TOKEN:?OBSERVABILITY_METRICS_TOKEN is required}
      OBSERVABILITY_SLOW_REQUEST_MS: ${OBSERVABILITY_SLOW_REQUEST_MS:-1000}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
    command: ["pnpm", "--filter", "@tradenest/api", "db:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ai:
    build:
      context: .
      dockerfile: infrastructure/docker/ai.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8000
    expose:
      - "8000"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    init: true
    environment: *api_environment
    ports:
      - "${DEPLOY_BIND_ADDRESS:-127.0.0.1}:${API_PUBLISH_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      TRADENEST_API_INTERNAL_URL: http://api:4000/api/v1
      TRADENEST_E2E_UI: "0"
    ports:
      - "${DEPLOY_BIND_ADDRESS:-127.0.0.1}:${WEB_PUBLISH_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

networks:
  backend:
    name: tradenest_backend

volumes:
  tradenest_postgres_data:
    name: tradenest_postgres_data
