name: TradeNest Database - PostgreSQL Integrity

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  database-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://tradenest:tradenest_local_only@127.0.0.1:5432/tradenest_test?schema=public
      TEST_DATABASE_URL: postgresql://tradenest:tradenest_local_only@127.0.0.1:5432/tradenest_test?schema=public
      JWT_ACCESS_SECRET: database-ci-secret-string-long-enough-for-testing
      PAYMENT_SANDBOX_WEBHOOK_SECRET: database-ci-webhook-string-long-enough-for-testing
      CATALOG_DEFAULT_CURRENCY: USD
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require authentic reviewed pnpm lockfile
        run: test -s pnpm-lock.yaml || { echo 'Foundation lockfile is missing; do not fabricate it' >&2; exit 1; }
      - name: Static Database guards
        run: pnpm verify:database && node --test scripts/tests/database-guards.test.mjs
      - name: Live PostgreSQL 18 acceptance
        run: pnpm acceptance:database
