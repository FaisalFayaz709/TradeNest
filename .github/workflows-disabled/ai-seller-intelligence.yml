name: TradeNest Seller intelligence - AI Integrity Gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  static-ai-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Locked architecture, blueprint endpoints, historical migrations
        run: |
          node scripts/verify-architecture.mjs
          node scripts/verify-api-contracts.mjs
          node scripts/verify-database-migration-chain.mjs
      - name: AI source checks and executable fallback tests
        run: |
          node scripts/verify-seller-intelligence-ai.mjs
          node --experimental-strip-types --test scripts/tests/seller-intelligence-ai-guards.test.mjs
      - name: Install pinned FastAPI runtime and test-only dependencies
        run: |
          python -m pip install -r services/ai/requirements.lock
          python -m pip install 'pytest>=8,<9' 'httpx>=0.27,<1'
      - name: FastAPI inference and internal request contract tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q services/ai/tests
      - name: Live acceptance remains a separate mandatory release gate
        run: echo 'Run pnpm acceptance:seller-intelligence on Node 24, pnpm 10.15.1 and PostgreSQL 18 after adding the genuine pnpm lockfile and test providers.'
